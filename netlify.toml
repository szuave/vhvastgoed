[build]
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

# Redirect /admin to /admin/ so relative paths resolve correctly
# (force = false so /admin/ itself isn't re-redirected, only the no-slash version)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
